# SIMPLE FIX: Just modify the existing services with minimal changes

# Your existing volumes, networks, and service templates stay the same
volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:
  qdrant_storage:

networks:
  demo:

# FIXED: Remove npm install from the anchor template
x-n8n: &service-n8n
  image: n8nio/n8n:latest
  networks: ['demo']
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY
    - N8N_USER_MANAGEMENT_JWT_SECRET
    - N8N_COMMUNITY_PACKAGES_ENABLED=true
    - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
    - OLLAMA_HOST=${OLLAMA_HOST:-ollama:11434}
  env_file:
    - path: .env
      required: true

# ... keep all your other x- templates unchanged ...

services:
  # ... keep postgres service unchanged ...
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    networks: ['demo']
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # SIMPLE FIX: Just change these two lines in your n8n-import service
  n8n-import:
    <<: *service-n8n
    hostname: n8n-import
    container_name: n8n-import
    user: root  # ADD THIS LINE
    entrypoint: /bin/sh
    command:
      - "-c"
      - |  # CHANGE TO MULTILINE STRING
        echo 'Clearing npm cache and installing FHIR nodes...' &&
        npm cache clean --force &&
        npm install -g --no-optional --loglevel=warn https://github.com/mudux/ruphasoft_n8n.git &&
        chown -R node:node /home/node/.n8n &&
        runuser -u node -- n8n import:credentials --separate --input=/demo-data/credentials &&
        runuser -u node -- n8n import:workflow --separate --input=/demo-data/workflows
    volumes:
      - n8n_storage:/home/node/.n8n  # ADD THIS LINE to share with main n8n
      - ./n8n/demo-data:/demo-data
    depends_on:
      postgres:
        condition: service_healthy

  # CHANGE: Main n8n service - just add proper command
  n8n:
    <<: *service-n8n
    hostname: n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - 5678:5678
    command: ["n8n", "start"]  # ADD THIS LINE - simple start command
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/demo-data:/demo-data
      - ./shared:/data/shared
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully

  # ... keep all other services unchanged ...