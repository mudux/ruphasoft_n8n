volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:
  qdrant_storage:

networks:
  demo:

# Fixed n8n service template - removed npm install from anchor
x-n8n: &service-n8n
  image: n8nio/n8n:latest
  networks: ['demo']
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY
    - N8N_USER_MANAGEMENT_JWT_SECRET
    # Install FHIR nodes from GitHub
    - N8N_COMMUNITY_PACKAGES_ENABLED=true
    - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
    - OLLAMA_HOST=${OLLAMA_HOST:-ollama:11434}
  env_file:
    - path: .env
      required: true

x-ollama: &service-ollama
  image: ollama/ollama:latest
  container_name: ollama
  networks: ['demo']
  restart: unless-stopped
  ports:
    - 11434:11434
  volumes:
    - ollama_storage:/root/.ollama

x-init-ollama: &init-ollama
  image: ollama/ollama:latest
  networks: ['demo']
  container_name: ollama-pull-llama
  volumes:
    - ollama_storage:/root/.ollama
  entrypoint: /bin/sh
  environment:
    - OLLAMA_HOST=ollama:11434
  command:
    - "-c"
    - "sleep 3; ollama pull llama3.2"

services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    networks: ['demo']
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # FINAL FIX: Handle dependency-style package correctly
  n8n-import:
    <<: *service-n8n
    hostname: n8n-import
    container_name: n8n-import
    user: root
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        echo 'Installing FHIR custom nodes from GitHub...'
        npm cache clean --force

        echo 'Creating n8n custom directory...'
        mkdir -p /home/node/.n8n/custom
        cd /home/node/.n8n/custom

        echo 'Installing package directly to custom directory...'
        npm install https://github.com/mudux/ruphasoft_n8n.git

        echo 'Copying nodes from installed package to correct location...'
        cp -r node_modules/fhir-n8n-custom-nodes/nodes .
        cp -r node_modules/fhir-n8n-custom-nodes/src . 2>/dev/null ||true

        echo 'Creating proper package.json for n8n...'
        cat > package.json << 'EOFPACKAGE'
        {
          "name": "ruphasoft-fhir-n8n-nodes",
          "version": "1.0.0",
          "description": "FHIR custom nodes for n8n",
          "main": "nodes/index.js",
          "n8n": {
            "n8nNodesApiVersion": 1,
            "nodes": [
              "nodes/patient.js",
              "nodes/appointment.js",
              "nodes/bundle.js",
              "nodes/claimResponse.js",
              "nodes/eligibilityResponse.js"
            ]
          }
        }
        EOFPACKAGE

        echo 'Custom nodes installed and configured successfully!'

        echo 'Fixing ownership...'
        chown -R node:node /home/node/.n8n

        echo 'Importing credentials...'
        su node -c 'n8n import:credentials --separate --input=/demo-data/credentials'
        echo 'Importing workflows...'
        su node -c 'n8n import:workflow --separate --input=/demo-data/workflows'
        echo 'Import completed successfully!'
    volumes:
      - n8n_storage:/home/node/.n8n  # Share storage with main n8n service
      - ./n8n/demo-data:/demo-data
    depends_on:
      postgres:
        condition: service_healthy

  # FIXED: Main n8n service with FHIR nodes pre-installed
  n8n:
    <<: *service-n8n
    hostname: n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - 5678:5678
    # Use default entrypoint and command - let n8n image handle it
    volumes:
      - n8n_storage:/home/node/.n8n  # Shared storage with installed packages
      - ./n8n/demo-data:/demo-data
      - ./shared:/data/shared
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully  # Wait for FHIR installation

  qdrant:
    image: qdrant/qdrant
    hostname: qdrant
    container_name: qdrant
    networks: ['demo']
    restart: unless-stopped
    ports:
      - 6333:6333
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama-cpu:
    profiles: ["cpu"]
    <<: *service-ollama

  ollama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *service-ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *service-ollama
    image: ollama/ollama:rocm
    devices:
      - "/dev/kfd"
      - "/dev/dri"

  ollama-pull-llama-cpu:
    profiles: ["cpu"]
    <<: *init-ollama
    depends_on:
      - ollama-cpu

  ollama-pull-llama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *init-ollama
    depends_on:
      - ollama-gpu

  ollama-pull-llama-gpu-amd:
    profiles: [gpu-amd]
    <<: *init-ollama
    image: ollama/ollama:rocm
    depends_on:
     - ollama-gpu-amd