volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:
  qdrant_storage:

networks:
  demo:

# Fixed n8n service template
x-n8n: &service-n8n
  image: n8nio/n8n:latest
  networks: ['demo']
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY
    - N8N_USER_MANAGEMENT_JWT_SECRET
    - N8N_COMMUNITY_PACKAGES_ENABLED=true
    - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
    - OLLAMA_HOST=${OLLAMA_HOST:-ollama:11434}
  env_file:
    - path: .env
      required: true

services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    networks: ['demo']
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # FIX FOR DEPENDENCY-STYLE PACKAGE: Clone and extract nodes manually
  n8n-import:
    <<: *service-n8n
    hostname: n8n-import
    container_name: n8n-import
    user: root
    entrypoint: /bin/sh
    command: >
      -c "
        echo 'Setting up for dependency-style package...' &&
        apk add --no-cache git &&
        npm cache clean --force &&

        echo 'Creating n8n custom directory...' &&
        mkdir -p /home/node/.n8n/custom &&
        cd /home/node/.n8n/custom &&

        echo 'Cloning repository...' &&
        git clone https://github.com/mudux/ruphasoft_n8n.git temp-repo &&

        echo 'Extracting nodes and creating proper package structure...' &&
        cp -r temp-repo/nodes . &&
        cp -r temp-repo/src . &&

        echo 'Creating proper package.json for n8n...' &&
        cat > package.json << 'EOF'
        {
          \"name\": \"ruphasoft-fhir-n8n-nodes\",
          \"version\": \"1.0.0\",
          \"description\": \"FHIR custom nodes for n8n\",
          \"main\": \"nodes/index.js\",
          \"n8n\": {
            \"n8nNodesApiVersion\": 1,
            \"nodes\": [
              \"nodes/patient.js\",
              \"nodes/appointment.js\",
              \"nodes/bundle.js\",
              \"nodes/claimResponse.js\",
              \"nodes/eligibilityResponse.js\"
            ]
          }
        }
        EOF

        echo 'Installing dependencies for the nodes...' &&
        npm install &&

        echo 'Cleaning up...' &&
        rm -rf temp-repo &&

        echo 'Fixing ownership...' &&
        chown -R node:node /home/node/.n8n &&

        echo 'Importing credentials and workflows...' &&
        su node -c 'n8n import:credentials --separate --input=/demo-data/credentials' &&
        su node -c 'n8n import:workflow --separate --input=/demo-data/workflows' &&
        echo 'Setup completed successfully!'
      "
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/demo-data:/demo-data
    depends_on:
      postgres:
        condition: service_healthy

  # Main n8n service
  n8n:
    <<: *service-n8n
    hostname: n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - 5678:5678
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/demo-data:/demo-data
      - ./shared:/data/shared
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully