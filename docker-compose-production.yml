volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:
  qdrant_storage:

networks:
  demo:

# Production n8n service template with TypeScript FHIR nodes
x-n8n: &service-n8n
  image: n8nio/n8n:latest
  networks: ['demo']
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY
    - N8N_USER_MANAGEMENT_JWT_SECRET
    # Enable custom nodes and community packages
    - N8N_COMMUNITY_PACKAGES_ENABLED=true
    - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
    - OLLAMA_HOST=${OLLAMA_HOST:-ollama:11434}
  env_file:
    - path: .env
      required: true

x-ollama: &service-ollama
  image: ollama/ollama:latest
  container_name: ollama
  networks: ['demo']
  restart: unless-stopped
  ports:
    - 11434:11434
  volumes:
    - ollama_storage:/root/.ollama

x-init-ollama: &init-ollama
  image: ollama/ollama:latest
  networks: ['demo']
  container_name: ollama-pull-llama
  volumes:
    - ollama_storage:/root/.ollama
  entrypoint: /bin/sh
  environment:
    - OLLAMA_HOST=ollama:11434
  command:
    - "-c"
    - "sleep 3; ollama pull llama3.2"

services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    networks: ['demo']
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # PRODUCTION: Install and build TypeScript FHIR nodes
  n8n-setup:
    <<: *service-n8n
    hostname: n8n-setup
    container_name: n8n-setup-typescript
    user: root
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        echo '🚀 Installing TypeScript-based FHIR custom nodes...'

        # Install Node.js build tools if needed
        echo '📦 Installing build dependencies...'
        apk add --no-cache git python3 make g++ || true

        echo '📁 Creating n8n custom directory structure...'
        mkdir -p /home/node/.n8n/custom/fhir-nodes
        cd /home/node/.n8n/custom/fhir-nodes

        echo '📋 Creating package.json with TypeScript FHIR nodes...'
        cat > package.json << 'EOFPACKAGE'
        {
          "name": "fhir-n8n-custom-nodes",
          "version": "1.0.0",
          "description": "FHIR transformation nodes for n8n with TypeScript implementation",
          "main": "dist/index.js",
          "n8n": {
            "n8nNodesApiVersion": 1,
            "strict": true,
            "credentials": [],
            "nodes": [
              "dist/nodes/FhirPatient/FhirPatient.node.js",
              "dist/nodes/FhirAppointment/FhirAppointment.node.js",
              "dist/nodes/FhirBundle/FhirBundle.node.js",
              "dist/nodes/FhirClaimResponse/FhirClaimResponse.node.js",
              "dist/nodes/FhirEligibilityResponse/FhirEligibilityResponse.node.js"
            ]
          },
          "scripts": {
            "build": "tsc",
            "dev": "n8n-node dev",
            "clean": "rm -rf dist"
          },
          "dependencies": {
            "n8n-workflow": "^1.120.1"
          },
          "devDependencies": {
            "@n8n/node-cli": "^0.17.0",
            "@types/node": "^18.19.130",
            "typescript": "^5.9.3"
          },
          "keywords": [
            "n8n",
            "n8n-community-node-package",
            "fhir",
            "healthcare",
            "transformation",
            "auto-detection",
            "mapping"
          ],
          "author": "FHIR n8n Team",
          "license": "MIT"
        }
        EOFPACKAGE

        echo '⚙️ Creating TypeScript configuration...'
        cat > tsconfig.json << 'EOFTSCONFIG'
        {
          "compilerOptions": {
            "target": "ES2020",
            "module": "commonjs",
            "lib": ["ES2020"],
            "outDir": "./dist",
            "rootDir": "./",
            "strict": true,
            "esModuleInterop": true,
            "skipLibCheck": true,
            "forceConsistentCasingInFileNames": true,
            "declaration": false,
            "sourceMap": false,
            "removeComments": true,
            "allowJs": true,
            "checkJs": false
          },
          "include": [
            "nodes/**/*",
            "credentials/**/*",
            "src/**/*"
          ],
          "exclude": [
            "node_modules",
            "dist",
            "archived"
          ]
        }
        EOFTSCONFIG

        echo '📥 Installing npm dependencies...'
        npm install --production=false

        echo '📄 Cloning FHIR nodes repository from GitHub...'
        # Clone the repository with TypeScript implementation
        git clone https://github.com/mudux/ruphasoft_n8n.git temp-repo

        echo '📋 Extracting TypeScript FHIR nodes...'
        # Copy the migrated TypeScript nodes and utilities
        cp -r temp-repo/nodes ./
        cp -r temp-repo/src ./

        echo '🧹 Cleaning up temporary files...'
        rm -rf temp-repo

        echo '🔨 Building TypeScript nodes...'
        npm run build

        echo '🧪 Verifying build...'
        ls -la dist/nodes/

        echo '✅ Verifying all 5 nodes are compiled...'
        for node in FhirPatient FhirAppointment FhirBundle FhirClaimResponse FhirEligibilityResponse; do
          if [ -f "dist/nodes/$node/$node.node.js" ]; then
            echo "  ✅ $node compiled successfully"
          else
            echo "  ❌ $node compilation failed"
            exit 1
          fi
        done

        echo '🔧 Testing node loading...'
        node -e "
          try {
            const patient = require('./dist/nodes/FhirPatient/FhirPatient.node.js');
            console.log('  ✅ FhirPatient loads:', patient.FhirPatient.name);

            const appointment = require('./dist/nodes/FhirAppointment/FhirAppointment.node.js');
            console.log('  ✅ FhirAppointment loads:', appointment.FhirAppointment.name);

            console.log('  🎉 All nodes load successfully!');
          } catch (error) {
            console.error('  ❌ Node loading failed:', error.message);
            process.exit(1);
          }
        "

        echo '👥 Fixing ownership...'
        chown -R node:node /home/node/.n8n

        echo '📊 Importing demo data (if available)...'
        if [ -d "/demo-data/credentials" ]; then
          echo 'Importing credentials...'
          su node -c 'n8n import:credentials --separate --input=/demo-data/credentials' || true
        fi

        if [ -d "/demo-data/workflows" ]; then
          echo 'Importing workflows...'
          su node -c 'n8n import:workflow --separate --input=/demo-data/workflows' || true
        fi

        echo '🎉 TypeScript FHIR nodes setup completed successfully!'
        echo '📋 Registered nodes:'
        echo '  • FHIR Patient'
        echo '  • FHIR Appointment'
        echo '  • FHIR Bundle'
        echo '  • FHIR Claim Response'
        echo '  • FHIR Eligibility Response'
    volumes:
      - n8n_storage:/home/node/.n8n  # Share storage with main n8n service
      - ./n8n/demo-data:/demo-data:ro     # Optional demo data
    depends_on:
      postgres:
        condition: service_healthy

  # PRODUCTION: Main n8n service with TypeScript FHIR nodes pre-installed
  n8n:
    <<: *service-n8n
    hostname: n8n
    container_name: n8n-production
    restart: unless-stopped
    ports:
      - 5678:5678
    volumes:
      - n8n_storage:/home/node/.n8n  # Shared storage with pre-installed TypeScript nodes
      - ./n8n/demo-data:/demo-data:ro
      - ./shared:/data/shared:rw
    depends_on:
      postgres:
        condition: service_healthy
      n8n-setup:
        condition: service_completed_successfully  # Wait for TypeScript FHIR installation

  # Vector database for AI/ML workflows
  qdrant:
    image: qdrant/qdrant
    hostname: qdrant
    container_name: qdrant
    networks: ['demo']
    restart: unless-stopped
    ports:
      - 6333:6333
    volumes:
      - qdrant_storage:/qdrant/storage

  # Ollama services for LLM integration (CPU profile by default)
  ollama-cpu:
    profiles: ["cpu"]
    <<: *service-ollama

  ollama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *service-ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *service-ollama
    image: ollama/ollama:rocm
    devices:
      - "/dev/kfd"
      - "/dev/dri"

  ollama-pull-llama-cpu:
    profiles: ["cpu"]
    <<: *init-ollama
    depends_on:
      - ollama-cpu

  ollama-pull-llama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *init-ollama
    depends_on:
      - ollama-gpu

  ollama-pull-llama-gpu-amd:
    profiles: [gpu-amd]
    <<: *init-ollama
    image: ollama/ollama:rocm
    depends_on:
     - ollama-gpu-amd