# Docker Compose Permission Fixes for n8n-import

# ============================================================================
# OPTION 1: Switch to root user, install, then switch back (RECOMMENDED)
# ============================================================================
  n8n-import-fix1:
    <<: *service-n8n
    hostname: n8n-import
    container_name: n8n-import
    user: root  # Run as root to install packages
    command: >
      -c "
        npm install -g https://github.com/your-org/fhir-n8n-custom-nodes.git &&
        chown -R node:node /home/node/.n8n &&
        su-exec node n8n import:credentials --separate --input=/demo-data/credentials &&
        su-exec node n8n import:workflow --separate --input=/demo-data/workflows
      "
    volumes:
      - ./n8n/demo-data:/demo-data
    depends_on:
      postgres:
        condition: service_healthy

# ============================================================================
# OPTION 2: Install to user directory instead of global (ALTERNATIVE)
# ============================================================================
  n8n-import-fix2:
    <<: *service-n8n
    hostname: n8n-import
    container_name: n8n-import
    environment:
      - NPM_CONFIG_PREFIX=/home/node/.npm-global
      - PATH=/home/node/.npm-global/bin:$PATH
    command: >
      -c "
        mkdir -p /home/node/.npm-global &&
        npm install -g https://github.com/your-org/fhir-n8n-custom-nodes.git &&
        n8n import:credentials --separate --input=/demo-data/credentials &&
        n8n import:workflow --separate --input=/demo-data/workflows
      "
    volumes:
      - ./n8n/demo-data:/demo-data
    depends_on:
      postgres:
        condition: service_healthy

# ============================================================================
# OPTION 3: Use npm unsafe-perm flag (SIMPLE BUT LESS SECURE)
# ============================================================================
  n8n-import-fix3:
    <<: *service-n8n
    hostname: n8n-import
    container_name: n8n-import
    command: >
      -c "
        npm install -g --unsafe-perm https://github.com/your-org/fhir-n8n-custom-nodes.git &&
        n8n import:credentials --separate --input=/demo-data/credentials &&
        n8n import:workflow --separate --input=/demo-data/workflows
      "
    volumes:
      - ./n8n/demo-data:/demo-data
    depends_on:
      postgres:
        condition: service_healthy

# ============================================================================
# OPTION 4: Use custom init script with proper user handling (PRODUCTION)
# ============================================================================
  n8n-import-fix4:
    <<: *service-n8n
    hostname: n8n-import
    container_name: n8n-import
    entrypoint: /bin/sh
    command: >
      -c "
        # Create init script
        cat > /tmp/install-and-import.sh << 'EOF'
        #!/bin/sh
        set -e

        # Switch to root for package installation
        if [ \"$(id -u)\" != \"0\" ]; then
          echo \"Switching to root for npm install...\"
          exec su-exec root \"$0\" \"$@\"
        fi

        # Install FHIR nodes globally as root
        echo \"Installing FHIR nodes...\"
        npm install -g https://github.com/your-org/fhir-n8n-custom-nodes.git

        # Fix ownership of n8n directory
        chown -R node:node /home/node/.n8n

        # Switch back to node user for n8n operations
        echo \"Importing data as node user...\"
        su-exec node n8n import:credentials --separate --input=/demo-data/credentials
        su-exec node n8n import:workflow --separate --input=/demo-data/workflows

        echo \"Import completed successfully!\"
        EOF

        # Make script executable and run it
        chmod +x /tmp/install-and-import.sh
        /tmp/install-and-import.sh
      "
    volumes:
      - ./n8n/demo-data:/demo-data
    depends_on:
      postgres:
        condition: service_healthy

# ============================================================================
# OPTION 5: Multi-stage approach with separate containers (CLEANEST)
# ============================================================================

  # First stage: Install packages
  n8n-package-installer:
    image: n8nio/n8n:latest
    user: root
    volumes:
      - n8n_global_modules:/usr/local/lib/node_modules
    command: >
      sh -c "
        npm install -g https://github.com/your-org/fhir-n8n-custom-nodes.git &&
        echo 'Package installation complete'
      "

  # Second stage: Import data
  n8n-import-fix5:
    <<: *service-n8n
    hostname: n8n-import
    container_name: n8n-import
    volumes:
      - ./n8n/demo-data:/demo-data
      - n8n_global_modules:/usr/local/lib/node_modules:ro
    command: >
      sh -c "
        n8n import:credentials --separate --input=/demo-data/credentials &&
        n8n import:workflow --separate --input=/demo-data/workflows
      "
    depends_on:
      n8n-package-installer:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

# Add volume for sharing installed packages
volumes:
  n8n_global_modules: