# Fixed Docker Compose Configuration for n8n-import service

  n8n-import:
    <<: *service-n8n
    hostname: n8n-import
    container_name: n8n-import
    entrypoint: /bin/sh
    command: >
      -c "
        npm install -g https://github.com/your-org/fhir-n8n-custom-nodes.git &&
        n8n import:credentials --separate --input=/demo-data/credentials &&
        n8n import:workflow --separate --input=/demo-data/workflows
      "
    volumes:
      - ./n8n/demo-data:/demo-data
    depends_on:
      postgres:
        condition: service_healthy

# Alternative approach using array syntax (if you prefer):
  n8n-import-alt:
    <<: *service-n8n
    hostname: n8n-import
    container_name: n8n-import
    command:
      - /bin/sh
      - -c
      - |
        npm install -g https://github.com/your-org/fhir-n8n-custom-nodes.git &&
        n8n import:credentials --separate --input=/demo-data/credentials &&
        n8n import:workflow --separate --input=/demo-data/workflows
    volumes:
      - ./n8n/demo-data:/demo-data
    depends_on:
      postgres:
        condition: service_healthy