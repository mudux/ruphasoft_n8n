version: '3.8'

volumes:
  n8n_storage:

networks:
  demo:

services:
  # Test n8n with TypeScript-built FHIR nodes
  n8n:
    image: n8nio/n8n:latest
    hostname: n8n
    container_name: n8n-typescript-test
    restart: unless-stopped
    ports:
      - 5678:5678
    networks: ['demo']
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=password
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
    volumes:
      - n8n_storage:/home/node/.n8n
      # Mount our built FHIR nodes directly
      - ./dist:/home/node/.n8n/custom/fhir-nodes/dist
      - ./package.json:/home/node/.n8n/custom/fhir-nodes/package.json
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        echo 'Setting up TypeScript-built FHIR nodes...'

        # Create the custom directory structure
        mkdir -p /home/node/.n8n/custom/fhir-nodes

        # Ensure our files are in place (they should be from volume mount)
        echo 'Checking mounted files...'
        ls -la /home/node/.n8n/custom/fhir-nodes/
        ls -la /home/node/.n8n/custom/fhir-nodes/dist/nodes/

        # Install dependencies within the custom directory
        cd /home/node/.n8n/custom/fhir-nodes
        echo 'Installing dependencies...'
        npm install --production --no-optional

        echo 'Fixing ownership...'
        chown -R node:node /home/node/.n8n

        echo 'Starting n8n...'
        su node -c 'n8n start'